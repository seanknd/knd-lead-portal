<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Prequalification Portal · Moss & Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet"/>

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Geist', -apple-system, system-ui, sans-serif; }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes typingDot {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
  input[type=range]::-webkit-slider-thumb { background: #1f3a2e; }
  input[type=range]::-moz-range-thumb { background: #1f3a2e; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="portal-chat.jsx"></script>
<script type="text/babel" src="email.jsx"></script>
<script type="text/babel" src="admin-dashboard.jsx"></script>

<!-- Thumbnail used by super_inline_html bundling -->
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#1f3a2e"/>
  <g transform="translate(70,50)" fill="#e8cdb8">
    <path d="M30 10c-10 10-10 24 0 34 10-10 10-24 0-34zM5 40c3-3 10-3 13 0-3 3-10 3-13 0zm50 0c-3-3-10-3-13 0 3 3 10 3 13 0zM30 54v8"/>
  </g>
  <text x="100" y="150" text-anchor="middle" font-family="Georgia, serif" fill="#e8cdb8" font-size="22" font-style="italic">Ivy</text>
</svg>
</template>

<script type="text/babel">
const { useState, useEffect } = React;

// ─────────────────────────────────────────────────────────────
// Hero
// ─────────────────────────────────────────────────────────────
function HeroPanel() {
  return (
    <div style={{ width: 680, padding: '32px 0 0' }}>
      <div style={{ fontFamily: T.mono, fontSize: 11, color: T.terracotta,
        letterSpacing: 1.5, textTransform: 'uppercase', marginBottom: 16 }}>
        Live · Lead Prequalification Portal · v2
      </div>
      <h1 style={{ fontFamily: T.display, fontSize: 72, fontWeight: 400, letterSpacing: -2.5,
        color: T.forestDeep, margin: 0, lineHeight: 1 }}>
        Meet <em style={{ fontStyle: 'italic', color: T.terracotta }}>Ivy</em>.<br/>
        She actually<br/>talks back.
      </h1>
      <p style={{ fontFamily: T.sans, fontSize: 17, color: T.inkSoft, lineHeight: 1.55,
        marginTop: 28, maxWidth: 560 }}>
        The portal to the right is live — Ivy's replies are generated by Claude in real time,
        photo uploads show actual thumbnails, and the address field hits OpenStreetMap for
        real autocomplete. Routing applies your cheat-sheet rules (Design-Build / Res Lite /
        Biz Dev / Commercial / DQ) the moment the chat ends.
      </p>
      <div style={{ display: 'flex', gap: 28, marginTop: 32, flexWrap: 'wrap',
        fontFamily: T.mono, fontSize: 11, color: T.inkFaint, letterSpacing: 0.5,
        textTransform: 'uppercase' }}>
        <div><span style={{ color: T.ok, fontSize: 14 }}>●</span>&nbsp; Live AI replies</div>
        <div><span style={{ color: T.ok, fontSize: 14 }}>●</span>&nbsp; Real file upload</div>
        <div><span style={{ color: T.ok, fontSize: 14 }}>●</span>&nbsp; Real address lookup</div>
        <div><span style={{ color: T.ok, fontSize: 14 }}>●</span>&nbsp; Cheat-sheet routing</div>
      </div>
      <div style={{ marginTop: 40, padding: '16px 20px', background: '#fff', borderRadius: 12,
        border: `1px solid ${T.line}`, maxWidth: 560 }}>
        <div style={{ fontFamily: T.mono, fontSize: 10.5, color: T.terracotta,
          letterSpacing: 1, textTransform: 'uppercase', marginBottom: 6 }}>
          Try it →
        </div>
        <div style={{ fontFamily: T.sans, fontSize: 14, color: T.inkSoft, lineHeight: 1.5 }}>
          Scroll right. The phone and desktop frames are fully interactive — type anything,
          Ivy will respond in character. Answers flow into the admin dashboard below.
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Live mobile portal (iOS frame)
// ─────────────────────────────────────────────────────────────
function LiveMobile() {
  return (
    <IOSDevice width={392} height={844}>
      <div style={{ height: '100%', paddingTop: 54, display: 'flex', flexDirection: 'column',
        background: T.cream }}>
        <PortalChat compact={true} />
      </div>
    </IOSDevice>
  );
}

// Live desktop portal
function LiveDesktop() {
  return (
    <ChromeWindow width={1000} height={680}
      url="portal.mossandstone.co/s/8f2k-91ma"
      tabs={[{ title: 'Moss & Stone · Your project' }, { title: 'Gmail' }]}>
      <div style={{ height: '100%', display: 'flex', background: T.cream }}>
        {/* brand sidebar */}
        <div style={{ width: 360, padding: '40px 34px', background: T.forestDeep,
          color: T.cream, display: 'flex', flexDirection: 'column' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 36 }}>
            <div style={{ width: 30, height: 30, borderRadius: 15, background: T.clay,
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="15" height="15" viewBox="0 0 18 18" fill={T.forestDeep}>
                <path d="M9 2c-3 3-3 7 0 10 3-3 3-7 0-10zM3 10c1-1 3-1 4 0-1 1-3 1-4 0zm12 0c-1-1-3-1-4 0 1 1 3 1 4 0zM9 14v2"/>
              </svg>
            </div>
            <span style={{ fontFamily: T.display, fontSize: 17, fontWeight: 500, letterSpacing: -0.3 }}>
              Moss &amp; Stone
            </span>
          </div>
          <div style={{ fontFamily: T.mono, fontSize: 10.5, color: T.clay, letterSpacing: 1.2,
            textTransform: 'uppercase', marginBottom: 16 }}>
            Project concierge · Sarah P.
          </div>
          <div style={{ fontFamily: T.display, fontSize: 38, fontWeight: 400, letterSpacing: -1.2,
            color: T.cream, lineHeight: 1.05, marginBottom: 20 }}>
            A quick<br/>conversation<br/>before we dig in.
          </div>
          <div style={{ fontFamily: T.sans, fontSize: 13.5, color: 'rgba(247,242,234,.7)',
            lineHeight: 1.55, marginBottom: 24 }}>
            Ivy will ask a few things so the right person from our team follows up
            — not just anyone with a clipboard.
          </div>
          <div style={{ marginTop: 'auto', paddingTop: 20, borderTop: '1px solid rgba(247,242,234,.15)',
            fontFamily: T.sans, fontSize: 12, color: 'rgba(247,242,234,.55)', lineHeight: 1.5 }}>
            Secured · we never share your info. <br/>Avg. time: 3 minutes.
          </div>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <PortalChat compact={false} />
        </div>
      </div>
    </ChromeWindow>
  );
}

// Intake email (in browser)
function EmailFrame() {
  return (
    <ChromeWindow width={720} height={780}
      url="mail.google.com/u/0/#inbox/191a8e"
      tabs={[{ title: 'Inbox (1 new)' }]}>
      <div style={{ minHeight: '100%' }}>
        <IntakeEmail />
      </div>
    </ChromeWindow>
  );
}

// Admin
function AdminFrame() {
  return (
    <ChromeWindow width={1280} height={820}
      url="ops.mossandstone.co/leads"
      tabs={[{ title: 'Moss & Stone · Lead Ops' }, { title: 'HubSpot' }]}>
      <div style={{ height: '100%' }}>
        <AdminDashboard />
      </div>
    </ChromeWindow>
  );
}

// Summary snapshot
function MobileSummarySnapshot() {
  const sampleAnswers = {
    scope: 'Full yard remodel',
    scopeDetail: 'Pavers, outdoor kitchen, built-in seating around a gas fire pit. Want to use the yard year-round.',
    budget: { label: '$100–250k', tier: 'Full yard remodel', raw: 175 },
    timeline: '1–3 months',
    address: { address: '1428 Olive Grove Ln, Pleasanton, CA 94566' },
    photos: { files: [{kind:'photo',url:null},{kind:'photo',url:null},{kind:'photo',url:null},{kind:'doc'}] },
    phone: '(510) 555-0142',
  };
  const routing = computeRouting(sampleAnswers);
  return (
    <IOSDevice width={392} height={844}>
      <div style={{ height: '100%', paddingTop: 54, background: T.cream, overflowY: 'auto' }}>
        <SummaryScreen answers={sampleAnswers} lead={{ firstName: 'Sarah' }} routing={routing}
          compact={true} onEdit={() => {}} />
      </div>
    </IOSDevice>
  );
}

function AdminDrawerOnly() {
  return (
    <div style={{ width: 440, height: 820, border: `1px solid ${T.line}`, overflow: 'hidden',
      borderRadius: 12, boxShadow: '0 1px 3px rgba(42,36,29,.06)' }}>
      <LeadDrawer lead={LEADS[0]} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Root
// ─────────────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection id="live" title="Live portal · try it"
        subtitle="Both frames are fully interactive. Ivy's replies are generated by Claude in real time — type anything.">
        <DCArtboard id="hero" label="Overview" width={680} height={680}>
          <div style={{ padding: '0 40px', height: '100%', background: T.cream }}>
            <HeroPanel/>
          </div>
        </DCArtboard>
        <DCArtboard id="mobile-live" label="Mobile · live chat" width={392} height={844}>
          <LiveMobile/>
        </DCArtboard>
        <DCArtboard id="desktop-live" label="Desktop · live chat" width={1000} height={680}>
          <LiveDesktop/>
        </DCArtboard>
      </DCSection>

      <DCSection id="touchpoints" title="Touchpoints"
        subtitle="The intake email, the routed summary the client sees at the end.">
        <DCArtboard id="email-web" label="Intake email" width={720} height={780}>
          <EmailFrame/>
        </DCArtboard>
        <DCArtboard id="m-summary" label="Summary · routed" width={392} height={844}>
          <MobileSummarySnapshot/>
        </DCArtboard>
      </DCSection>

      <DCSection id="admin" title="Team dashboard · internal"
        subtitle="Your ops view. AI routing rec per lead, DQ flags, auto-generated HubSpot note.">
        <DCArtboard id="admin-full" label="Inbox + drawer" width={1280} height={820}>
          <AdminFrame/>
        </DCArtboard>
        <DCArtboard id="admin-drawer" label="Lead drawer · detail" width={440} height={820}>
          <AdminDrawerOnly/>
        </DCArtboard>
      </DCSection>

      <DCPostIt top={80} right={60} rotate={2} width={230}>
        Live AI + real file upload + real address lookup are wired. HubSpot webhook & your own brand/name still TBD — say the word.
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
